name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # unittest discovery imports pytest-based modules too, so install the
      # test runner before either test command starts.
      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Hosted demo policy export matches Python
        run: python tools/export_cloud_demo.py --check

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Pytest compatibility checks
        run: python -m pytest -q

      - name: End-to-end smoke (mock backend)
        run: |
          python -m arbiter --db /tmp/arbiter.db seed
          python -m arbiter --db /tmp/arbiter.db run samples/events.jsonl --audit /tmp/audit.jsonl
          test -s /tmp/audit.jsonl

      # Informational: the mock backend is *expected* to miss the fact-trap
      # attacks (that's the argument for a real local model). Becomes a hard
      # gate once an Ollama-backed eval runs somewhere with a GPU.
      - name: Eval report (mock backend, non-blocking)
        continue-on-error: true
        run: python -m arbiter --db /tmp/eval.db eval samples/eval_set.jsonl

  # The frontend was untested by CI until 2026-07-30: a broken tsc, a bad
  # import or a prerender that throws would all have merged green, and would
  # only have surfaced the next time someone ran a build by hand.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npx oxlint

      - name: Hosted AI demo contracts
        run: npm run test:demo

      # build:public is the strictest of the three builds: client bundle, SSR
      # bundle, then the prerender script that renders Site() to static HTML.
      # If the landing throws during SSR, this is where it shows up.
      - name: Build public site
        run: npm run build:public

      # The landing must never name a competitor or make a pricing claim
      # (docs/LANDING-BRIEF.md §2). Cheap to state as a rule, easy to
      # reintroduce by accident in a copy edit — so the rule is a test.
      - name: No competitor or pricing copy in the built site
        run: |
          if grep -rniE "siem|splunk|gigabyte|per gb" dist --include=*.html --include=*.js; then
            echo "::error::forbidden positioning copy found in the built site"
            exit 1
          fi

  aws-fixtures:
    runs-on: ubuntu-latest
    env:
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional SDK for mocked contract tests
        run: python -m pip install -e '.[aws]'
      - name: No-credential AWS fixture tests
        run: python -m unittest tests.test_aws_sdk tests.test_ingestion -v
