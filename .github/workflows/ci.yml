name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: End-to-end smoke (mock backend)
        run: |
          python -m arbiter --db /tmp/arbiter.db seed
          python -m arbiter --db /tmp/arbiter.db run samples/events.jsonl --audit /tmp/audit.jsonl
          test -s /tmp/audit.jsonl

      # Informational: the mock backend is *expected* to miss the fact-trap
      # attacks (that's the argument for a real local model). Becomes a hard
      # gate once an Ollama-backed eval runs somewhere with a GPU.
      - name: Eval report (mock backend, non-blocking)
        continue-on-error: true
        run: python -m arbiter --db /tmp/eval.db eval samples/eval_set.jsonl
