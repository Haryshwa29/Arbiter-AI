name: Release

# Tag a version to cut a release:
#   git tag v0.2.0 && git push origin v0.2.0
#
# Produces the four artifacts the install page links to: the zipapp, both
# bootstrap scripts, and SHA256SUMS. The install scripts read SHA256SUMS to
# discover the version, so nothing here needs hardcoding.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Tests must pass before anything ships
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build self-hosted dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build release artifacts
        run: python tools/build_release.py --clean

      - name: Verify the built zipapp runs
        run: |
          PYZ=$(ls dist/arbiter-*.pyz)
          python "$PYZ" --version
          python "$PYZ" --status --prefix /tmp/arbiter-check || true
          python "$PYZ" --install --dry-run --prefix /tmp/arbiter-check --backend mock

      - name: Verify checksums match the artifacts
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Tag version must match arbiter.__version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          CODE=$(python -c "import arbiter; print(arbiter.__version__)")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$CODE" != "$TAG" ]; then
            echo "tag $TAG does not match arbiter.__version__ $CODE"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: arbiter-release
          path: dist/

  windows-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Windows setup launcher
        shell: powershell
        run: |
          $compiler = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $compiler /nologo /target:exe /platform:x64 `
            '/out:Install Arbiter.exe' `
            '/resource:packaging\install.ps1,Arbiter.InstallScript' `
            packaging\WindowsSetupLauncher.cs
      - uses: actions/upload-artifact@v4
        with:
          name: arbiter-windows-setup
          path: Install Arbiter.exe

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows-setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: arbiter-*
          merge-multiple: true
          path: release
      - name: Add the setup executable to the release checksums
        run: cd release && sha256sum "Install Arbiter.exe" >> SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          name: "${{ github.ref_name }} — Development preview"
          body: |
            Development preview. Local installation and manual response approval only;
            continuous boot/sleep reliability remains under validation.

            ## Install

            **Windows**

            Download **Install Arbiter.exe**. It checks the computer and recommends
            Local AI with Qwen 3.5 4B or the smaller rules-only installation.

            **Linux / macOS**
            ```sh
            curl -fsSLO https://github.com/${{ github.repository }}/releases/latest/download/install.sh
            less install.sh
            sh install.sh
            ```

            Release files are listed in `SHA256SUMS`. The Windows and shell
            bootstraps verify the Arbiter application before installing it.
