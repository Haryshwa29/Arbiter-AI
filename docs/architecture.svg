<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
<style>
.t{fill:#c9d1d9;font-size:14px;font-weight:600}.s{fill:#8b949e;font-size:12px}
.lbl{fill:#5dcaa5;font-size:12px}
</style>
<rect width="680" height="620" fill="#0d1117"/>
<rect x="16" y="16" width="648" height="588" rx="10" fill="none" stroke="#2f6f57" stroke-width="1" stroke-dasharray="5 4"/>
<text x="30" y="38" class="lbl">customer network · nothing leaves the box</text>

<rect x="150" y="52" width="280" height="46" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="290" y="73" class="t" text-anchor="middle">your log streams</text>
<text x="290" y="90" class="s" text-anchor="middle">sshd · auditd · nginx · cloud logs</text>
<line x1="290" y1="98" x2="290" y2="118" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="150" y="122" width="280" height="46" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="290" y="143" class="t" text-anchor="middle">collector</text>
<text x="290" y="160" class="s" text-anchor="middle">normalizes every log to the Event schema</text>
<line x1="290" y1="168" x2="290" y2="188" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="150" y="192" width="280" height="50" rx="6" fill="#10233b" stroke="#1f4e7a"/>
<text x="290" y="214" class="t" text-anchor="middle" fill="#86bdf5">tier 1 · prefilter (cheap)</text>
<text x="290" y="231" class="s" text-anchor="middle">severity × criticality × history — handles most</text>
<line x1="290" y1="242" x2="290" y2="264" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
<text x="298" y="259" class="s" fill="#86bdf5">ambiguous only</text>

<rect x="150" y="268" width="280" height="50" rx="6" fill="#10233b" stroke="#1f4e7a"/>
<text x="290" y="290" class="t" text-anchor="middle" fill="#86bdf5">tier 2 · local LLM (qwen)</text>
<text x="290" y="307" class="s" text-anchor="middle">runs on your hardware — open weights</text>
<line x1="290" y1="318" x2="290" y2="340" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="150" y="344" width="280" height="50" rx="6" fill="#241a38" stroke="#4b3a86"/>
<text x="290" y="366" class="t" text-anchor="middle" fill="#cbb2f5">verdict</text>
<text x="290" y="383" class="s" text-anchor="middle">escalate + evidence · suppress + rationale</text>
<path d="M255 394 L232 422" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M325 394 L348 422" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="80" y="424" width="200" height="52" rx="6" fill="#0f2a22" stroke="#1d6e56"/>
<text x="180" y="446" class="t" text-anchor="middle" fill="#6fe0bd">dashboard</text>
<text x="180" y="463" class="s" text-anchor="middle">analyst sees, acts, resolves</text>

<rect x="300" y="424" width="200" height="52" rx="6" fill="#33170f" stroke="#7a3d24"/>
<text x="400" y="446" class="t" text-anchor="middle" fill="#f0a482">response actuator</text>
<text x="400" y="463" class="s" text-anchor="middle">surgical · TTL · reversible</text>

<rect x="470" y="192" width="180" height="126" rx="6" fill="#0f2a22" stroke="#1d6e56"/>
<text x="560" y="216" class="t" text-anchor="middle" fill="#6fe0bd">memory (SQLite)</text>
<text x="560" y="238" class="s" text-anchor="middle">asset criticality</text>
<text x="560" y="256" class="s" text-anchor="middle">verdict history</text>
<text x="560" y="274" class="s" text-anchor="middle">environment facts</text>
<text x="560" y="292" class="s" text-anchor="middle">human feedback</text>
<text x="560" y="310" class="lbl" text-anchor="middle">learns, never leaves</text>
<line x1="470" y1="222" x2="434" y2="216" stroke="#5f6b66" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#a)"/>
<line x1="470" y1="292" x2="434" y2="292" stroke="#5f6b66" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#a)"/>
<path d="M180 424 L180 340 L466 264" fill="none" stroke="#5f6b66" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#a)"/>
<text x="196" y="360" class="lbl">analyst feedback trains memory</text>

<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
</svg>
