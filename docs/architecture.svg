<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2540" viewBox="0 0 1440 2540" role="img" aria-labelledby="title desc">
<title id="title">Arbiter AI: five decision workers and one CPU report worker</title>
<desc id="desc">Only successful Qwen3.5:4b escalations enter the L2 pre-filter. Supported routine cases can be suppressed; unresolved cases, including missing context, reach Gemma4:12b. Proposed Gemma suppressions require a checking call. All L1 and L2 exits pass shared final guardrails. Saved decisions reach the dashboard immediately; a separate CPU worker prepares reports without model calls. Scoped live pattern memory feeds each pre-filter. Either model is replaceable. Classification grants no device-action rights.</desc>
<rect width="1440" height="2540" fill="#0d1420"/>
<text x="54" y="51" fill="#82b7ff" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="700">ARBITER AI / CURRENT PROJECT DESIGN / NOVEMBER 2026</text>
<text x="54" y="114" fill="#eef3fa" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="38" font-weight="700">Two brains decide. A separate worker explains.</text>
<text x="54" y="159" fill="#b8c5d8" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="25" font-weight="400">Five decision workers + one CPU report worker. Models and evidence stay local.</text>
<rect x="330" y="205" width="780" height="130" rx="16" fill="#172335" stroke="#82b7ff" stroke-width="2"/>
<text x="352" y="245" fill="#82b7ff" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="26" font-weight="700">Enabled sources or isolated practice replay</text>
<text x="352" y="282" fill="#b8c5d8" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Read original security reports; check and normalize each record.</text>
<text x="352" y="310" fill="#b8c5d8" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Collection permissions and device actions remain separate.</text>
<polyline points="720,335 720,380" fill="none" stroke="#82b7ff" stroke-width="3" stroke-linejoin="round"/>
<polygon points="720,380 714.0,369.0 726.0,369.0" fill="#82b7ff"/>
<rect x="330" y="380" width="780" height="130" rx="16" fill="#172335" stroke="#82b7ff" stroke-width="2"/>
<text x="352" y="420" fill="#82b7ff" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="26" font-weight="700">Durable waiting line: keep events through restart</text>
<text x="352" y="457" fill="#b8c5d8" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Save pending work in SQLite. Limit capacity and show overload.</text>
<text x="352" y="485" fill="#b8c5d8" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Keep source identity, original facts and timestamps.</text>
<polyline points="720,510 720,555" fill="none" stroke="#82b7ff" stroke-width="3" stroke-linejoin="round"/>
<polygon points="720,555 714.0,544.0 726.0,544.0" fill="#82b7ff"/>
<rect x="330" y="555" width="780" height="130" rx="16" fill="#172335" stroke="#82b7ff" stroke-width="2"/>
<text x="352" y="595" fill="#82b7ff" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="26" font-weight="700">WORKER 1 / Gateway: connect the clues</text>
<text x="352" y="632" fill="#b8c5d8" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Choose a saved event; add nearby activity and relevant local facts.</text>
<text x="352" y="660" fill="#b8c5d8" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Prepare the evidence before either model reviews it.</text>
<polyline points="720,685 720,730" fill="none" stroke="#82b7ff" stroke-width="3" stroke-linejoin="round"/>
<polygon points="720,730 714.0,719.0 726.0,719.0" fill="#82b7ff"/>
<rect x="330" y="730" width="780" height="155" rx="16" fill="#241c35" stroke="#c4a0ff" stroke-width="2"/>
<text x="352" y="770" fill="#c4a0ff" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="26" font-weight="700">WORKER 2 / L1 rules + Qwen3.5:4b</text>
<text x="352" y="807" fill="#b8c5d8" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Quick rules handle clear cases. Qwen reviews unclear activity.</text>
<text x="352" y="835" fill="#b8c5d8" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400">It can quiet an event or raise a warning with a short reason.</text>
<text x="352" y="863" fill="#b8c5d8" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400">L1 can review another event while Gemma works.</text>
<polyline points="720,885 720,990" fill="none" stroke="#c4a0ff" stroke-width="3" stroke-linejoin="round"/>
<polygon points="720,990 714.0,979.0 726.0,979.0" fill="#c4a0ff"/>
<text x="742" y="937" fill="#c4a0ff" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="18" font-weight="700">Only successful Qwen model escalations</text>
<rect x="330" y="990" width="780" height="130" rx="16" fill="#172335" stroke="#82b7ff" stroke-width="2"/>
<text x="352" y="1030" fill="#82b7ff" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="26" font-weight="700">WORKER 3 / Independent L2 pre-filter</text>
<text x="352" y="1067" fill="#b8c5d8" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Quiet an eligible routine case only with supporting evidence.</text>
<text x="352" y="1095" fill="#b8c5d8" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Pass unresolved warnings to Gemma, even with missing context.</text>
<polyline points="720,1120 720,1225" fill="none" stroke="#c4a0ff" stroke-width="3" stroke-linejoin="round"/>
<polygon points="720,1225 714.0,1214.0 726.0,1214.0" fill="#c4a0ff"/>
<text x="742" y="1169" fill="#c4a0ff" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="18" font-weight="700">Unresolved: ask the second brain</text>
<rect x="330" y="1225" width="780" height="155" rx="16" fill="#241c35" stroke="#c4a0ff" stroke-width="2"/>
<text x="352" y="1265" fill="#c4a0ff" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="26" font-weight="700">WORKER 4 / L2: Gemma4:12b</text>
<text x="352" y="1302" fill="#b8c5d8" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Read original facts without Qwen&#x27;s opinion text.</text>
<text x="352" y="1330" fill="#b8c5d8" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Return a compact decision, explanations and supplied evidence IDs.</text>
<text x="352" y="1358" fill="#b8c5d8" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Proposed suppression needs a checking call and 90% confidence.</text>
<polyline points="720,1380 720,1490" fill="none" stroke="#f2c777" stroke-width="3" stroke-linejoin="round"/>
<polygon points="720,1490 714.0,1479.0 726.0,1479.0" fill="#f2c777"/>
<text x="742" y="1435" fill="#f2c777" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="18" font-weight="700">Check the proposed outcome</text>
<polyline points="330,808 98,808 98,1555 330,1555" fill="none" stroke="#82b7ff" stroke-width="3" stroke-linejoin="round"/>
<polygon points="330,1555 319.0,1561.0 319.0,1549.0" fill="#82b7ff"/>
<text x="122" y="972" fill="#82b7ff" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="18" font-weight="700">Other L1 exits:</text>
<text x="122" y="996" fill="#82b7ff" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="18" font-weight="700">quiet decisions,</text>
<text x="122" y="1020" fill="#82b7ff" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="18" font-weight="700">mandatory rules,</text>
<text x="122" y="1044" fill="#82b7ff" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="18" font-weight="700">failed Qwen calls.</text>
<text x="122" y="1068" fill="#82b7ff" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="18" font-weight="700"></text>
<text x="122" y="1092" fill="#82b7ff" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="18" font-weight="700">Bypass Gemma;</text>
<text x="122" y="1116" fill="#82b7ff" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="18" font-weight="700">still checked.</text>
<polyline points="1110,1055 1338,1055 1338,1555 1110,1555" fill="none" stroke="#7cddb0" stroke-width="3" stroke-linejoin="round"/>
<polygon points="1110,1555 1121.0,1549.0 1121.0,1561.0" fill="#7cddb0"/>
<text x="1135" y="1156" fill="#7cddb0" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="18" font-weight="700">Supported</text>
<text x="1135" y="1180" fill="#7cddb0" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="18" font-weight="700">routine case:</text>
<text x="1135" y="1204" fill="#7cddb0" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="18" font-weight="700">bypass Gemma;</text>
<text x="1135" y="1228" fill="#7cddb0" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="18" font-weight="700">still checked.</text>
<rect x="330" y="1490" width="780" height="130" rx="16" fill="#172335" stroke="#f2c777" stroke-width="2"/>
<text x="352" y="1530" fill="#f2c777" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="26" font-weight="700">WORKER 5 / Shared final guardrail</text>
<text x="352" y="1567" fill="#b8c5d8" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Check every L1 and L2 exit, including pre-filter shortcuts.</text>
<text x="352" y="1595" fill="#b8c5d8" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Protected risk, failed review or rejected suppression stays visible.</text>
<polyline points="720,1620 720,1725" fill="none" stroke="#82b7ff" stroke-width="3" stroke-linejoin="round"/>
<polygon points="720,1725 714.0,1714.0 726.0,1714.0" fill="#82b7ff"/>
<rect x="330" y="1725" width="780" height="130" rx="16" fill="#172335" stroke="#7cddb0" stroke-width="2"/>
<text x="352" y="1765" fill="#7cddb0" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="26" font-weight="700">Save the final decision, facts and actual model context</text>
<text x="352" y="1802" fill="#b8c5d8" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Keep visible for investigation OR quiet with a recorded reason.</text>
<text x="352" y="1830" fill="#b8c5d8" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Preserve L1, L2 and final outcomes; queue a durable report job.</text>
<polyline points="720,1855 720,1900 355,1900 355,1970" fill="none" stroke="#82b7ff" stroke-width="3" stroke-linejoin="round"/>
<polygon points="355,1970 349.0,1959.0 361.0,1959.0" fill="#82b7ff"/>
<text x="182" y="1941" fill="#82b7ff" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="18" font-weight="700">Decision visible now</text>
<polyline points="720,1855 720,1900 1085,1900 1085,1970" fill="none" stroke="#f2c777" stroke-width="3" stroke-linejoin="round"/>
<polygon points="1085,1970 1079.0,1959.0 1091.0,1959.0" fill="#f2c777"/>
<text x="864" y="1941" fill="#f2c777" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="18" font-weight="700">Report job: separate work</text>
<rect x="50" y="1970" width="610" height="135" rx="16" fill="#172335" stroke="#82b7ff" stroke-width="2"/>
<text x="72" y="2010" fill="#82b7ff" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="26" font-weight="700">Authenticated dashboard / API</text>
<text x="72" y="2047" fill="#b8c5d8" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Show saved decisions and both reviewers.</text>
<text x="72" y="2075" fill="#b8c5d8" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Partial facts first; final report when ready.</text>
<rect x="780" y="1970" width="610" height="135" rx="16" fill="#172335" stroke="#f2c777" stroke-width="2"/>
<text x="802" y="2010" fill="#f2c777" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="26" font-weight="700">WORKER 6 / CPU report writer</text>
<text x="802" y="2047" fill="#b8c5d8" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Six local templates use saved evidence.</text>
<text x="802" y="2075" fill="#b8c5d8" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400">No AI call. Decisions do not wait for it.</text>
<polyline points="780,2038 660,2038" fill="none" stroke="#f2c777" stroke-width="3" stroke-linejoin="round"/>
<polygon points="660,2038 671.0,2032.0 671.0,2044.0" fill="#f2c777"/>
<text x="54" y="2182" fill="#7cddb0" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="22" font-weight="700">REMEMBER ELIGIBLE LIVE REPEATS / LOCAL SQLITE MEMORY</text>
<rect x="50" y="2210" width="650" height="135" rx="16" fill="#172335" stroke="#7cddb0" stroke-width="2"/>
<text x="72" y="2250" fill="#7cddb0" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="26" font-weight="700">Qwen-approved patterns feed L1 rules</text>
<text x="72" y="2287" fill="#b8c5d8" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Exact host, source, content and model scope.</text>
<text x="72" y="2315" fill="#b8c5d8" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Record origin, reason and template.</text>
<rect x="740" y="2210" width="650" height="135" rx="16" fill="#172335" stroke="#7cddb0" stroke-width="2"/>
<text x="762" y="2250" fill="#7cddb0" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="26" font-weight="700">Gemma-approved patterns feed L2 rules</text>
<text x="762" y="2287" fill="#b8c5d8" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Challenge and final gates must pass first.</text>
<text x="762" y="2315" fill="#b8c5d8" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" font-weight="400">A match avoids another Gemma review.</text>
<text x="54" y="2397" fill="#b8c5d8" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="22" font-weight="400">Expires after 1 hour or 25 hits; revocable. File/API/demo/replay cannot teach or use shortcuts.</text>
<text x="54" y="2442" fill="#b8c5d8" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="22" font-weight="400">Either brain can use a compatible local replacement. Ollama is the runner, not the model.</text>
<text x="54" y="2492" fill="#f2c777" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="22" font-weight="700">Classification does not authorize commands or device changes. New report-worker speed: retest next.</text>
</svg>
