<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1490" viewBox="0 0 1000 1490" role="img" aria-labelledby="title desc">
<title id="title">From a signal to a durable event</title><desc id="desc">Customer network / collection does not invoke the model. Read the accompanying architecture walkthrough for a complete text equivalent.</desc>
