<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1686" viewBox="0 0 1000 1686" role="img" aria-labelledby="title desc">
<title id="title">Rules first. Qwen3.5 when needed.</title><desc id="desc">The AI can recommend a decision; it cannot authorize changes to a device. Read the accompanying architecture walkthrough for a complete text equivalent.</desc>
<rect width="1000" height="1686" fill="#101820"/>
<text x="70" y="60" fill="#8bbcff" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="20" font-weight="600">02 / DECIDE WHAT NEEDS ATTENTION</text>
<text x="70" y="119" fill="#edf2f5" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="37" font-weight="600">Rules first. Qwen3.5 when needed.</text>
<text x="70" y="161" fill="#b0becb" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="19" font-weight="400">The AI can recommend a decision; it cannot authorize changes to a device</text>
