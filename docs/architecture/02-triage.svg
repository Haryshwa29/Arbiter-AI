<path d="M184,1181 L190,1190 L196,1181" fill="none" stroke="#536575" stroke-width="3"/>
<rect x="70" y="210" width="860" height="142" rx="12" fill="#18232e" stroke="#536575"/><path d="M71,230 V332" stroke="#8bbcff" stroke-width="4"/>
<text x="94" y="254" fill="#8bbcff" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="25" font-weight="600">Start with the event and relevant history</text>
<text x="94" y="294" fill="#b0becb" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="20" font-weight="400">Check how important the computer is and what happened before</text>
<text x="94" y="323" fill="#b0becb" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="20" font-weight="400">Use approved facts only when they fit this exact event</text>
<rect x="70" y="406" width="860" height="142" rx="12" fill="#18232e" stroke="#536575"/><path d="M71,426 V528" stroke="#eac080" stroke-width="4"/>
<text x="94" y="450" fill="#eac080" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="25" font-weight="600">Safety rules: must someone review this?</text>
<text x="94" y="490" fill="#b0becb" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="20" font-weight="400">Known risky signals normally create an alert without asking AI</text>
<text x="94" y="519" fill="#b0becb" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="20" font-weight="400">An exact approved fact can allow AI review, never dismissal by itself</text>
<rect x="70" y="602" width="860" height="142" rx="12" fill="#18232e" stroke="#536575"/><path d="M71,622 V724" stroke="#8bbcff" stroke-width="4"/>
<text x="94" y="646" fill="#8bbcff" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="25" font-weight="600">Quick rules: is the answer already clear?</text>
<text x="94" y="686" fill="#b0becb" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="20" font-weight="400">Keep clearly routine records quietly; flag clearly risky ones</text>
<text x="94" y="715" fill="#b0becb" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="20" font-weight="400">Ask the AI when the rules do not have enough support to decide</text>
<rect x="70" y="798" width="860" height="142" rx="12" fill="#18232e" stroke="#536575"/><path d="M71,818 V920" stroke="#c4a7ff" stroke-width="4"/>
<text x="94" y="842" fill="#c4a7ff" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="25" font-weight="600">Qwen3.5: a replaceable local AI model</text>
<text x="94" y="882" fill="#b0becb" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="20" font-weight="400">Read unclear alerts and explain a recommendation</text>
<text x="94" y="911" fill="#b0becb" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="20" font-weight="400">Another compatible local model can replace Qwen3.5</text>
<rect x="70" y="994" width="860" height="142" rx="12" fill="#18232e" stroke="#536575"/><path d="M71,1014 V1116" stroke="#eac080" stroke-width="4"/>
<text x="94" y="1038" fill="#eac080" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="25" font-weight="600">Check the AI&#x27;s recommendation</text>
<text x="94" y="1078" fill="#b0becb" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="20" font-weight="400">Safety rules still apply; a fluent explanation is not proof</text>
<text x="94" y="1107" fill="#b0becb" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="20" font-weight="400">If the AI fails or is too unsure, ask a person to review</text>
<rect x="70" y="1190" width="414" height="142" rx="12" fill="#18232e" stroke="#536575"/><path d="M71,1210 V1312" stroke="#94d7b4" stroke-width="4"/>
<text x="94" y="1234" fill="#94d7b4" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="25" font-weight="600">Keep an observation</text>
<text x="94" y="1274" fill="#b0becb" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="20" font-weight="400">Write why it was quieted</text>
<text x="94" y="1303" fill="#b0becb" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="20" font-weight="400">Keep the record</text>
<rect x="516" y="1190" width="414" height="142" rx="12" fill="#18232e" stroke="#536575"/><path d="M517,1210 V1312" stroke="#ff9c95" stroke-width="4"/>
<text x="540" y="1234" fill="#ff9c95" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="25" font-weight="600">Flag for review</text>
<text x="540" y="1274" fill="#b0becb" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="20" font-weight="400">Show the evidence and reason</text>
<text x="540" y="1303" fill="#b0becb" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="20" font-weight="400">Ask a person to investigate</text>
<rect x="70" y="1386" width="860" height="142" rx="12" fill="#18232e" stroke="#536575"/><path d="M71,1406 V1508" stroke="#8bbcff" stroke-width="4"/>
<text x="94" y="1430" fill="#8bbcff" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="25" font-weight="600">Save the decision and its reason</text>
<text x="94" y="1470" fill="#b0becb" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="20" font-weight="400">Keep the evidence, history and rule or model that decided</text>
<text x="94" y="1499" fill="#b0becb" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="20" font-weight="400">Make the result available for a person to check later</text>
<text x="70" y="1634" fill="#b0becb" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="18" font-weight="400">Side arrows show where safety rules or quick rules can decide without AI.</text>
</svg>
