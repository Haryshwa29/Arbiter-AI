<!DOCTYPE html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Arbiter — clickable prototype</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--s1:#161b22;--s2:#1c222b;--s3:#232b36;--bd:#21262d;
--tx:#c9d1d9;--tx2:#8b949e;--tx3:#6e7681;--acc:#58a6ff;--danger:#f85149;--dangerbg:#2a1516;
--ok:#7ee787;--okbg:#132017;--pro:#d2a8ff;--amber:#e3b341}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.5}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
a{color:var(--acc);text-decoration:none;cursor:pointer}
.btn{background:var(--s2);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:8px 15px;font-size:13px;cursor:pointer}
.btn:hover{background:var(--s3)}
.btn.primary{background:#238636;border-color:#238636;color:#fff}.btn.primary:hover{background:#2ea043}
.btn.danger{background:#3d1214;border-color:#5c1e1e;color:var(--danger)}.btn.danger:hover{background:#4a1618}
.btn.sm{padding:5px 11px;font-size:12px}
input,textarea,select{background:var(--s1);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:9px 12px;font-size:14px;width:100%;font-family:inherit}
textarea{resize:vertical;min-height:70px}
.hide{display:none!important}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.vrow{display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:10px;font-size:12.5px;animation:slidein .5s ease;cursor:pointer;border:1px solid transparent}
.vrow:hover{border-color:var(--bd)}
.pill{font-weight:600;min-width:64px}
.navitem{padding:7px 10px;border-radius:8px;font-size:13px;color:var(--tx2);margin-bottom:2px;cursor:pointer;display:flex;align-items:center;gap:8px}
.navitem:hover{background:var(--s2)}.navitem.active{background:var(--s3);color:var(--tx)}
.metric{background:var(--s1);border-radius:12px;padding:13px 16px}
.metric.clk{cursor:pointer;border:1px solid transparent}.metric.clk:hover{border-color:var(--bd);background:var(--s2)}
.metric .l{font-size:12px;color:var(--tx3)}.metric .v{font-size:24px;font-weight:600;margin-top:4px}
.btn.dsel{background:var(--danger);border-color:var(--danger);color:#fff}
.toggle{position:relative;width:38px;height:22px;background:var(--s3);border-radius:20px;cursor:pointer;border:1px solid var(--bd);flex:0 0 auto}
.toggle.on{background:#238636;border-color:#238636}
.toggle .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on .knob{left:18px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--s3);border:1px solid var(--bd);border-radius:10px;padding:10px 18px;font-size:13px;z-index:100;animation:slidein .3s}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--tx3);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--bd)}
td{padding:9px 10px;border-bottom:1px solid var(--bd)}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
.chip{font-size:11px;padding:2px 8px;border-radius:20px}
.status{font-size:10.5px;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em}
.st-open{background:var(--dangerbg);color:var(--danger)}
.st-investigating{background:#2b2410;color:var(--amber)}
.st-resolved{background:var(--okbg);color:var(--ok)}
.st-auto{background:var(--s3);color:var(--tx3)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow:auto}
#modalCard{background:var(--bg);border:1px solid var(--bd);border-radius:14px;max-width:640px;width:100%;padding:0}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;font-size:12.5px}
.kv .k{color:var(--tx3)}.kv .v{color:var(--tx)}
.sect{padding:16px 20px;border-bottom:1px solid var(--bd)}
.sect h4{margin:0 0 10px;font-size:12px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
</style></head><body>

<div id="splash"></div>
<div id="login" class="hide"></div>
<div id="app" class="hide" style="display:flex"></div>
<div id="modal" class="hide"><div id="modalCard"></div></div>
<div id="toast" class="hide"></div>

<script>
let settings={escalateAt:'7.0',suppressBelow:'3.0',model:'qwen3.5:4b',shadow:true,autoblock:false,llmauto:false,retentionDays:'30'};
let userList=[{u:'priya',r:'admin',t:'2h ago'},{u:'arjun',r:'analyst',t:'5m ago'},{u:'sam',r:'analyst',t:'yesterday'}];
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hide');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.add('hide'),2400);}
function saveSettings(){toast('Settings saved · escalate ≥ '+settings.escalateAt+', model '+settings.model+' · logged to audit');}
function addUser(){const el=document.getElementById('nu');const u=(el.value||'').trim();if(!u){toast('Enter a username');return;}userList.push({u,r:document.getElementById('nr').value,t:'never'});toast('Added '+u+' as '+document.getElementById('nr').value);renderApp();}
function removeUser(i){const u=userList[i].u;userList.splice(i,1);toast('Removed '+u);renderApp();}
const state={role:'admin',user:'priya',page:'overview',esconly:false};
const CRIT={'db-prod-01':2.0,'web-prod-01':1.6,'ci-runner-01':0.8,'dev-laptop-42':0.5,'nas-01':1.1,'vpn-gw-01':1.3};
let SEQ=1, events=[], reports=[
 {id:'r1',title:'Daily digest — Jul 6',kind:'auto',body:'12 escalations, 2,835 suppressed, 0 missed on labeled probes. Two response actions approved (1 IP block, 1 session kill). Mean time-to-verdict 0.3s.'},
 {id:'r2',title:'Monthly customer report — June',kind:'auto',body:'Anonymized attack-pattern summary and posture trend for the month. Ready to send to stakeholders.'},
];

/* event templates: realistic detail + a recommended response where applicable */
const TPL=[
 {dec:'escalate',tier:'prefilter',host:'web-prod-01',source:'sshd',type:'auth_bruteforce',sev:8.5,
  msg:"48 failed password attempts for root from 185.220.101.7 in 60s, then accepted password",
  fields:{src_ip:'185.220.101.7',user:'root',attempts:48},
  why:'score 10.0 ≥ 7 (severity 8.5 × criticality 1.6). Brute force followed by a successful auth is a likely account takeover.',
  ev:'Check whether 185.220.101.7 has any prior successful logins; review what root did after 02:14.',
  resp:{kind:'block_ip',target:'185.220.101.7',ttl:60,mode:'AUTO'}},
 {dec:'escalate',tier:'llm',host:'vpn-gw-01',source:'vpn',type:'geo_impossible_travel',sev:7.5,
  msg:"login for maria from 203.0.113.50 (RU) 6 min after office login from 49.207.1.9 (IN) — impossible travel",
  fields:{src_ip:'203.0.113.50',user:'maria',prev_geo:'IN',geo:'RU',gap_min:6},
  why:'Two logins for the same account from different countries 6 minutes apart is physically impossible. No environment fact explains it.',
  ev:"Call maria out-of-band to confirm. Kill her active session and force re-auth.",
  resp:{kind:'kill_session + lock_account',target:'maria',ttl:null,mode:'RECOMMEND'}},
 {dec:'escalate',tier:'llm',host:'nas-01',source:'auditd',type:'mass_file_rename',sev:6.0,
  msg:"3,400 files renamed with .lockd extension in 5m by process /tmp/updater on /srv/files",
  fields:{count:3400,binary:'/tmp/updater',volume:'/srv/files'},
  why:'Mass rename to a uniform extension by a binary in /tmp is the classic ransomware signature.',
  ev:'Kill /tmp/updater now and quarantine nas-01 before more files are encrypted.',
  resp:{kind:'kill_process + quarantine_host',target:'/tmp/updater',ttl:60,mode:'RECOMMEND'}},
 {dec:'escalate',tier:'llm',host:'dev-laptop-42',source:'auditd',type:'priv_escalation',sev:6.0,
  msg:"user jenny added to sudo group by process /tmp/.helper; new crontab entry installed",
  fields:{user:'jenny',binary:'/tmp/.helper'},
  why:"Indicators ['sudo','crontab'] plus a binary in /tmp. Low-value host, so the prefilter passed it to the model, which escalated.",
  ev:'Inspect /tmp/.helper and the new crontab entry on dev-laptop-42.',
  resp:{kind:'lock_account',target:'jenny',ttl:null,mode:'RECOMMEND'}},
 {dec:'suppress',tier:'llm',host:'db-prod-01',source:'node_exporter',type:'io_anomaly',sev:2.0,
  msg:"nightly disk IO spike on /var/lib/postgresql during backups window",
  fields:{iops:9200},
  why:'Matches the environment fact "backups run at 02:00 — nightly IO spike on db-prod-01 is normal".',ev:'',resp:null},
 {dec:'suppress',tier:'prefilter',host:'ci-runner-01',source:'auditd',type:'process_burst',sev:3.2,
  msg:"212 short-lived containers spawned in 10m by runner process churn",
  fields:{count:212},
  why:'Signature seen 40× before, always benign, never overruled — suppressed for free by the prefilter.',ev:'',resp:null},
 {dec:'suppress',tier:'llm',host:'web-prod-01',source:'nginx',type:'traffic_spike',sev:4.0,
  msg:"traffic spike to 9,000 req/s during product launch campaign window, error rate normal 0.2%",
  fields:{rps:9000,error_rate:0.002},
  why:'Launch-window fact explains the spike and the error rate is normal.',ev:'',resp:null},
];

function esc(s){const d=document.createElement('div');d.textContent=(s==null?'':String(s));return d.innerHTML}
function decColor(d){return d==='escalate'?'var(--danger)':'var(--ok)'}
function tierColor(t){return t==='prefilter'?'var(--acc)':'var(--pro)'}

function mkEvent(tpl){
 const score=tpl.dec==='escalate'?Math.min(10,tpl.sev*(CRIT[tpl.host]||1)) : Math.max(0.5,tpl.sev*(CRIT[tpl.host]||1)*0.5);
 return {...tpl,id:'e'+(SEQ++),score:+score.toFixed(1),ts:Date.now(),
   status:tpl.dec==='escalate'?'open':'auto',feedback:null,note:'',resolvedBy:null,respStatus:'pending'};
}
function seedEvents(){for(let i=0;i<9;i++)events.push(mkEvent(TPL[i%TPL.length]));}

/* ---------- SPLASH ---------- */
function renderSplash(){document.getElementById('splash').innerHTML=`
 <div style="max-width:560px;margin:9vh auto;padding:0 20px;text-align:center">
  <div style="display:inline-flex;align-items:center;gap:9px;margin-bottom:18px"><span style="font-size:26px">◈</span><span style="font-size:24px;font-weight:600">Arbiter</span></div>
  <p style="font-size:15px;color:var(--tx2);margin:0 0 4px">This network is protected by Arbiter — a self-hosted AI security analyst.</p>
  <p style="font-size:13px;color:var(--tx3);margin:0 0 32px">Every alert is triaged locally. Your data never leaves the network.</p>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:30px">
   ${[['1.24M','events triaged to date','var(--tx)'],['1.23M','quietly suppressed','var(--ok)'],['8,410','raised to a human','var(--tx)']].map(c=>`<div class="card"><div style="font-size:26px;font-weight:600;color:${c[2]}">${c[0]}</div><div style="font-size:12px;color:var(--tx3);margin-top:5px">${c[1]}</div></div>`).join('')}</div>
  <button class="btn" onclick="go('login')">🔒 Sign in</button>
  <p style="margin-top:26px;font-size:11.5px;color:var(--tx3);line-height:1.6">Nothing on this page identifies a host, address, account, or event. Operational detail is visible only after sign-in.</p>
 </div>`;}

/* ---------- LOGIN ---------- */
function renderLogin(){document.getElementById('login').innerHTML=`
 <div style="max-width:340px;margin:13vh auto;padding:0 20px">
  <div style="display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:24px"><span style="font-size:22px">◈</span><span style="font-size:20px;font-weight:600">Arbiter</span></div>
  <label style="font-size:12px;color:var(--tx2)">username</label><input value="priya" style="margin:5px 0 14px">
  <label style="font-size:12px;color:var(--tx2)">password</label><input type="password" value="••••••••" style="margin:5px 0 8px">
  <div style="font-size:11px;color:var(--tx3);margin-bottom:16px">demo — sign in as <a onclick="state.role='admin';signIn()">admin</a> or <a onclick="state.role='analyst';signIn()">analyst</a></div>
  <button class="btn primary" style="width:100%" onclick="signIn()">Sign in</button>
  <p style="text-align:center;margin-top:18px"><a onclick="go('splash')" style="font-size:12px;color:var(--tx3)">← back</a></p>
 </div>`;}
function signIn(){state.user=state.role==='admin'?'priya':'arjun';state.page='overview';go('app');renderApp();}

/* ---------- SHELL ---------- */
const PAGES_SEE=[['overview','Overview','◱'],['feed','Live feed','◈'],['verdicts','Verdicts & audit','☰'],['reports','Reports','▤'],['assets','Assets & facts','▦']];
const PAGES_ADMIN=[['settings','AI settings','⚙'],['users','Users & roles','◑'],['retention','Retention & policy','◷']];
function nav(){
 const item=p=>`<div class="navitem ${state.page===p[0]?'active':''}" onclick="state.page='${p[0]}';renderApp()"><span style="width:16px">${p[2]}</span>${p[1]}${p[0]==='overview'?attn():''}</div>`;
 const admin=state.role==='admin'?`<div style="font-size:10px;color:var(--tx3);letter-spacing:.06em;margin:16px 6px 6px">ADMINISTER</div>${PAGES_ADMIN.map(item).join('')}`:'';
 return `<div style="width:210px;flex:0 0 210px;background:var(--s1);min-height:100vh;padding:16px 12px">
  <div style="display:flex;align-items:center;gap:8px;padding:2px 6px 14px;border-bottom:1px solid var(--bd)"><span style="font-size:19px">◈</span><span style="font-weight:600">Arbiter</span><span style="margin-left:auto;font-size:11px;color:var(--ok)"><span style="animation:pulse 2.4s infinite">●</span> live</span></div>
  <div style="font-size:10px;color:var(--tx3);letter-spacing:.06em;margin:14px 6px 6px">MONITOR</div>${PAGES_SEE.map(item).join('')}${admin}
  <div style="margin-top:24px;padding:10px 6px;border-top:1px solid var(--bd);font-size:12px;color:var(--tx2)">${esc(state.user)} · <span style="color:var(--acc)">${state.role}</span>
   <div style="margin-top:8px;display:flex;gap:6px"><button class="btn sm" onclick="switchRole()">view as ${state.role==='admin'?'analyst':'admin'}</button><button class="btn sm" onclick="go('splash')">sign out</button></div></div></div>`;
}
function attn(){const n=openEsc().length;return n?`<span class="chip" style="margin-left:auto;background:var(--dangerbg);color:var(--danger)">${n}</span>`:'';}
function switchRole(){state.role=state.role==='admin'?'analyst':'admin';state.user=state.role==='admin'?'priya':'arjun';if(state.role!=='admin'&&['settings','users','retention'].includes(state.page))state.page='overview';renderApp();}
function openEsc(){return events.filter(e=>e.dec==='escalate'&&e.status!=='resolved');}

function renderApp(){document.getElementById('app').innerHTML=nav()+`<div style="flex:1;padding:22px 26px;max-width:940px">${pageContent()}</div>`;if(state.page==='feed'||state.page==='overview')startFeed();}

function pageContent(){
 if(['settings','users','retention'].includes(state.page)&&state.role!=='admin')
  return `<div class="card" style="color:var(--tx2)">🔒 This area is for admins only. You're signed in as analyst.</div>`;
 return {overview:pgOverview,feed:pgFeed,verdicts:pgVerdicts,reports:pgReports,assets:pgAssets,settings:pgSettings,users:pgUsers,retention:pgRetention}[state.page]();
}

/* ---------- OVERVIEW (distinct: counters + attention queue, not a feed clone) ---------- */
function counts(){
 const esc=events.filter(e=>e.dec==='escalate');
 const open=esc.filter(e=>e.status!=='resolved').length;
 const resolved=esc.filter(e=>e.status==='resolved').length;
 const supp=events.filter(e=>e.dec==='suppress').length;
 return {total:events.length,open,resolved,supp};
}
function ovRow(e,col){return `<div class="vrow" style="background:var(--s1)" onclick="openEvent('${e.id}')">
   ${e.status!=='auto'?`<span class="status st-${e.status}">${e.status}</span>`:`<span class="pill" style="color:var(--ok);min-width:0">suppressed</span>`}
   <span>${esc(e.host)}</span><span class="mono" style="color:var(--tx3);font-size:11.5px">${esc(e.source)}/${esc(e.type)}</span>
   <span class="mono" style="margin-left:auto;color:${col}">${e.score.toFixed(1)}</span><span style="color:var(--tx3)">›</span></div>`;}
function pgOverview(){
 const c=counts();
 const queue=openEsc();
 const supp=events.filter(e=>e.dec==='suppress').slice().reverse().slice(0,6);
 const q=queue.length?queue.map(e=>ovRow(e,'var(--danger)')).join('')
   :`<div class="card" style="color:var(--tx2)">✓ Nothing waiting on you. Every escalation has been actioned.</div>`;
 const sl=supp.map(e=>ovRow(e,'var(--tx3)')).join('');
 return `<div style="font-size:19px;font-weight:600">Good to see you, ${esc(state.user)}</div>
 <p style="color:var(--tx3);font-size:13px;margin:2px 0 18px" id="ovsub">${c.open} open of ${c.total} events this session — ${c.resolved} resolved, ${c.supp} auto-suppressed.</p>
 <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:24px">
  <div class="metric clk" onclick="goFeed('all')"><div class="l">events this session</div><div class="v" id="m_total">${c.total}</div></div>
  <div class="metric clk" onclick="goFeed('open')"><div class="l">needs a human</div><div class="v" id="m_open" style="color:var(--danger)">${c.open}</div></div>
  <div class="metric clk" onclick="goFeed('resolved')"><div class="l">you resolved</div><div class="v" id="m_res" style="color:var(--ok)">${c.resolved}</div></div>
  <div class="metric clk" onclick="goFeed('suppress')"><div class="l">auto-suppressed</div><div class="v" id="m_supp">${c.supp}</div></div></div>
 <div style="font-size:15px;font-weight:600;margin-bottom:4px">Needs your attention</div>
 <p style="color:var(--tx3);font-size:12.5px;margin:0 0 10px">Open escalations, newest first. Click one to investigate and act.</p>
 <div style="display:flex;flex-direction:column;gap:6px">${q}</div>
 <div style="display:flex;align-items:center;gap:10px;margin:22px 0 4px"><span style="font-size:15px;font-weight:600">Recently auto-suppressed</span><a style="margin-left:auto;font-size:12px" onclick="goFeed('suppress')">see all →</a></div>
 <p style="color:var(--tx3);font-size:12.5px;margin:0 0 10px">Handled without you — each with a written reason. Click to see why.</p>
 <div style="display:flex;flex-direction:column;gap:6px">${sl||'<div class="card" style="color:var(--tx2)">No suppressions yet this session.</div>'}</div>`;
}
function goFeed(f){state.feedFilter=f;state.esconly=false;state.page='feed';renderApp();}

/* ---------- LIVE FEED (clickable) ---------- */
function feedRow(e){
 const bg=e.dec==='escalate'?'background:var(--dangerbg)':'background:var(--s1)';
 const st=e.status!=='auto'?`<span class="status st-${e.status}">${e.status}</span>`:'';
 return `<div class="vrow" data-esc="${e.dec==='escalate'}" style="${bg}" onclick="openEvent('${e.id}')">
  <span class="pill" style="color:${decColor(e.dec)}">${e.dec==='escalate'?'ESCALATE':'suppress'}</span>
  <span class="mono" style="font-size:11px;color:${tierColor(e.tier)}">${e.tier}</span>
  <span>${esc(e.host)}</span><span class="mono" style="color:var(--tx3);font-size:11.5px">${esc(e.source)}/${esc(e.type)}</span>
  ${st}<span class="mono" style="margin-left:auto">${e.score.toFixed(1)}</span></div>`;
}
const FILTER_LABEL={all:'all events',open:'needs a human',resolved:'resolved by you',suppress:'auto-suppressed'};
function pgFeed(){
 const f=state.feedFilter||'all';
 const chip=f!=='all'?`<span class="chip" style="background:var(--s3);color:var(--acc)">filter: ${FILTER_LABEL[f]} <a onclick="state.feedFilter='all';renderApp()" style="color:var(--tx3)">✕</a></span>`:'';
 return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
  <span style="font-size:19px;font-weight:600">Live feed</span><span style="font-size:11px;color:var(--tx3)">newest first · click any event</span>${chip}
  <label style="margin-left:auto;font-size:12px;color:var(--tx2)"><input type="checkbox" style="width:auto;vertical-align:-1px" ${state.esconly?'checked':''} onchange="state.esconly=this.checked;renderApp()"> escalations only</label></div>
 <div id="feed" style="display:flex;flex-direction:column;gap:6px"></div>`;
}

/* ---------- EVENT DETAIL MODAL + ACTIONS ---------- */
function openEvent(id){
 const e=events.find(x=>x.id===id);if(!e)return;
 const fields=Object.entries(e.fields).map(([k,v])=>`<div class="k">${esc(k)}</div><div class="v mono">${esc(v)}</div>`).join('');
 const resp=e.resp?`<div class="sect"><h4>recommended response</h4>
   <div style="display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:11px 13px">
    <span class="chip" style="background:${e.resp.mode==='AUTO'?'var(--okbg)':'#2b2410'};color:${e.resp.mode==='AUTO'?'var(--ok)':'var(--amber)'}">${e.resp.mode}${e.resp.mode==='AUTO'?' · dry-run':''}</span>
    <span class="mono" style="font-size:12.5px">${esc(e.resp.kind)} → ${esc(e.resp.target)}${e.resp.ttl?' · ttl '+e.resp.ttl+'m':''}</span>
    <span style="margin-left:auto;font-size:12px;color:${e.respStatus==='approved'?'var(--ok)':e.respStatus==='denied'?'var(--tx3)':'var(--tx2)'}">${e.respStatus==='pending'?'':e.respStatus}</span></div>
   ${e.respStatus==='pending'?`<div style="display:flex;gap:8px;margin-top:10px"><button class="btn primary sm" onclick="approveResp('${e.id}')">Approve action</button><button class="btn sm" onclick="denyResp('${e.id}')">Dismiss</button></div>`:''}</div>`:'';
 const acted=e.dec==='escalate'&&e.status!=='resolved';
 const fbLine=e.feedback==='confirmed'
   ? `<div style="font-size:12px;color:var(--ok);margin-bottom:12px">✓ You agreed — this reinforces the verdict in Arbiter's memory.</div>`
   : e.feedback==='overruled'
   ? `<div style="font-size:12px;color:var(--amber);margin-bottom:12px">✕ Overruled — Arbiter will ${e.dec==='escalate'?'learn this signature is benign and stop escalating it':'stop suppressing this signature and escalate it in future'}. Feeds <span class="mono">memory.label_verdicts</span>.</div>`
   : `<div style="font-size:12px;color:var(--tx3);margin-bottom:12px">Was Arbiter right? Your call trains the memory layer.</div>`;
 const actions=`<div class="sect"><h4>your call ${state.role==='analyst'?'(analyst)':'(admin)'}</h4>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
    <button class="btn sm ${e.feedback==='confirmed'?'primary':''}" onclick="setFeedback('${e.id}','confirmed')">✓ Agree with verdict</button>
    <button class="btn sm ${e.feedback==='overruled'?'dsel':'danger'}" onclick="setFeedback('${e.id}','overruled')">✕ Overrule — ${e.dec==='escalate'?'it was benign':'this was actually bad'}</button>
   </div>
   ${fbLine}
   <div style="font-size:12px;color:var(--tx3);margin-bottom:6px">${e.dec==='escalate'?'What did you do about it? Arbiter turns this into a report.':'Tell Arbiter why, so it learns this signature.'}</div>
   <textarea id="note_${e.id}" placeholder="e.g. Confirmed with maria it wasn't her. Reset her password, revoked sessions, blocked the RU IP at the firewall.">${esc(e.note)}</textarea>
   <div style="display:flex;gap:8px;margin-top:10px;align-items:center">
    ${acted?`<button class="btn primary sm" onclick="resolveEvent('${e.id}')">Mark resolved &amp; generate report</button>`:''}
    <button class="btn sm" onclick="saveNote('${e.id}')">Save note</button>
    ${e.status==='resolved'?`<span class="status st-resolved">resolved by ${esc(e.resolvedBy)}</span>`:''}
   </div></div>`;
 document.getElementById('modalCard').innerHTML=`
  <div class="sect" style="display:flex;align-items:center;gap:10px">
   <span class="pill" style="color:${decColor(e.dec)}">${e.dec==='escalate'?'ESCALATE':'SUPPRESS'}</span>
   <span class="mono" style="font-size:11px;color:${tierColor(e.tier)}">${e.tier} tier</span>
   ${e.status!=='auto'?`<span class="status st-${e.status}">${e.status}</span>`:''}
   <span style="margin-left:auto;font-size:19px;font-weight:600" class="mono">${e.score.toFixed(1)}</span>
   <button class="btn sm" onclick="closeModal()" style="padding:4px 9px">✕</button></div>
  <div class="sect"><h4>what happened</h4>
   <div class="kv"><div class="k">host</div><div class="v">${esc(e.host)} <span style="color:var(--tx3)">· criticality ${(CRIT[e.host]||1).toFixed(1)}</span></div>
    <div class="k">signature</div><div class="v mono">${esc(e.source)}/${esc(e.type)}</div>
    <div class="k">severity</div><div class="v">${e.sev}</div>${fields}</div>
   <div style="margin-top:10px;background:var(--s1);border-radius:8px;padding:10px 12px;font-size:12.5px" class="mono">${esc(e.msg)}</div></div>
  <div class="sect"><h4>why Arbiter decided this</h4>
   <div style="font-size:13px">${esc(e.why)}</div>
   ${e.ev?`<div style="margin-top:8px;font-size:12.5px;color:var(--amber)">▸ ${esc(e.ev)}</div>`:''}</div>
  ${resp}${actions}`;
 document.getElementById('modal').classList.remove('hide');
}
function closeModal(){document.getElementById('modal').classList.add('hide');}
function saveNote(id){const e=events.find(x=>x.id===id);e.note=document.getElementById('note_'+id).value;openEvent(id);}
function setFeedback(id,val){const e=events.find(x=>x.id===id);e.feedback=val;openEvent(id);}
function approveResp(id){const e=events.find(x=>x.id===id);e.respStatus='approved';openEvent(id);}
function denyResp(id){const e=events.find(x=>x.id===id);e.respStatus='denied';openEvent(id);}
function resolveEvent(id){
 const e=events.find(x=>x.id===id);e.note=document.getElementById('note_'+id).value;
 e.status='resolved';e.resolvedBy=state.user;
 reports.unshift({id:'r'+Date.now(),title:`Incident — ${e.host} ${e.type}`,kind:state.user,
  body:`${e.msg}\n\nVerdict: ${e.dec} (${e.tier}, score ${e.score.toFixed(1)}). Analyst ${e.resolvedBy} marked this resolved`+
   (e.feedback?`, ${e.feedback} the verdict`:'')+(e.respStatus==='approved'?`, approved response ${e.resp.kind}`:'')+
   `.\n\nWhat they did: ${e.note||'(no note)'}`});
 closeModal();renderApp();
}

/* ---------- VERDICTS TABLE ---------- */

 const rows=events.map(e=>`<tr style="cursor:pointer" onclick="openEvent('${e.id}')">
   <td><span style="color:${decColor(e.dec)};font-weight:600">${e.dec==='escalate'?'ESCALATE':'suppress'}</span></td>
   <td class="mono" style="color:${tierColor(e.tier)}">${e.tier}</td><td>${esc(e.host)}</td>
   <td class="mono" style="color:var(--tx2)">${esc(e.source)}/${esc(e.type)}</td><td class="mono">${e.score.toFixed(1)}</td>
   <td>${e.status!=='auto'?`<span class="status st-${e.status}">${e.status}</span>`:'<span style="color:var(--tx3)">—</span>'}</td></tr>`).join('');

 <p style="color:var(--tx3);font-size:13px;margin:0 0 14px">Searchable history · kept 30 days · click any row to open it</p>
 <div style="display:flex;gap:8px;margin-bottom:12px"><select><option>all decisions</option><option>escalate</option><option>suppress</option></select>
  <select><option>all hosts</option>${Object.keys(CRIT).map(h=>`<option>${h}</option>`).join('')}</select>
  <input placeholder="search…" style="max-width:220px"></div>
 <div class="card" style="padding:4px 8px"><table><tr><th>verdict</th><th>tier</th><th>host</th><th>signature</th><th>score</th><th>status</th></tr>${rows}</table></div>`;
}

 <p style="color:var(--tx3);font-size:13px;margin:0 0 16px">Auto digests plus incident reports Arbiter writes from what you did. Click to read.</p>

function openReport(id){const r=reports.find(x=>x.id===id);
 document.getElementById('modalCard').innerHTML=`<div class="sect" style="display:flex;align-items:center;gap:10px">
   <span style="font-size:16px;font-weight:600">${esc(r.title)}</span><span class="chip" style="background:var(--s3);color:var(--acc)">${r.kind==='auto'?'auto':'by '+esc(r.kind)}</span>
   <button class="btn sm" style="margin-left:auto;padding:4px 9px" onclick="closeModal()">✕</button></div>
  <div class="sect" style="white-space:pre-wrap;font-size:13px;line-height:1.6">${esc(r.body)}</div>
  <div class="sect" style="display:flex;gap:8px"><button class="btn primary sm">Export PDF</button><button class="btn sm">Send to stakeholders</button></div>`;
 document.getElementById('modal').classList.remove('hide');
}

 const rows=Object.entries(CRIT).map(([h,c])=>`<tr><td>${h}</td><td><span class="chip" style="background:${c>=1.5?'var(--dangerbg)':'var(--s3)'};color:${c>=1.5?'var(--danger)':'var(--tx2)'}">${c.toFixed(1)}</span></td><td style="color:var(--tx2)">${c>=1.5?'crown jewel':c>=1?'important':'low'}</td><td style="color:var(--tx3)">confirmed</td></tr>`).join('');
 return `<div style="font-size:19px;font-weight:600;margin-bottom:4px">Assets & facts</div>
 <p style="color:var(--tx3);font-size:13px;margin:0 0 16px">The transparency layer — what Arbiter knows about your estate, in plain text.</p>
 <div style="font-size:13px;font-weight:600;margin-bottom:8px">Asset criticality</div>
 <div class="card" style="padding:4px 8px;margin-bottom:20px"><table><tr><th>host</th><th>criticality</th><th>tier</th><th>status</th></tr>${rows}</table></div>
 <div style="font-size:13px;font-weight:600;margin-bottom:8px">Environment facts</div>

function pgSettings(){
 const s=settings;
 const row=(key,l,d)=>`<div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd)"><div><div style="font-size:13px">${l}</div><div style="font-size:12px;color:var(--tx3)">${d}</div></div><span class="toggle ${s[key]?'on':''}" style="margin-left:auto" onclick="settings.${key}=!settings.${key};renderApp()"><span class="knob"></span></span></div>`;
 return `<div style="font-size:19px;font-weight:600;margin-bottom:4px">AI settings</div><p style="color:var(--tx3);font-size:13px;margin:0 0 16px">Admin only. Changes are written to the audit trail.</p>
 <div class="card"><div style="display:flex;gap:24px;margin-bottom:8px">
  <div><div style="font-size:12px;color:var(--tx3)">escalate at</div><input value="${s.escalateAt}" onchange="settings.escalateAt=this.value" style="width:80px;margin-top:4px"></div>
  <div><div style="font-size:12px;color:var(--tx3)">suppress below</div><input value="${s.suppressBelow}" onchange="settings.suppressBelow=this.value" style="width:80px;margin-top:4px"></div>
  <div><div style="font-size:12px;color:var(--tx3)">model</div><select onchange="settings.model=this.value" style="margin-top:6px">${['qwen3.5:4b','llama3.1:8b','mock'].map(m=>`<option ${s.model===m?'selected':''}>${m}</option>`).join('')}</select></div></div>
  ${row('shadow','Shadow mode','Log verdicts, never actually suppress')}${row('autoblock','Auto-block (prefilter tier only)','Surgical, TTL-limited, reversible')}${row('llmauto','LLM-tier auto-execute','Model verdicts always need human approval')}
  <div style="margin-top:14px"><button class="btn primary sm" onclick="saveSettings()">Save changes</button></div></div>`;
}

 return `<div style="font-size:19px;font-weight:600;margin-bottom:4px">Users & roles</div><p style="color:var(--tx3);font-size:13px;margin:0 0 16px">Admin only. Two signed-in roles: analyst (see + act) and admin (+ configure).</p>
 <div class="card" style="padding:4px 8px;margin-bottom:12px"><table><tr><th>user</th><th>role</th><th>last login</th><th></th></tr>${userList.map((x,i)=>`<tr><td>${esc(x.u)}</td><td><span class="chip" style="background:var(--s3);color:var(--acc)">${esc(x.r)}</span></td><td style="color:var(--tx3)">${esc(x.t)}</td><td>${x.u===state.user?'<span style="color:var(--tx3);font-size:12px">you</span>':`<a style="font-size:12px;color:var(--danger)" onclick="removeUser(${i})">remove</a>`}</td></tr>`).join('')}</table></div>

 <div class="card"><div style="display:flex;align-items:center;gap:12px"><div style="font-size:13px">Keep raw audit detail for</div><input value="${settings.retentionDays}" onchange="settings.retentionDays=this.value" style="width:70px"><span style="color:var(--tx2)">days</span></div>

  <div style="margin-top:14px;display:flex;gap:8px"><button class="btn primary sm" onclick="toast('Retention saved · '+settings.retentionDays+'-day window · logged to audit')">Save</button><button class="btn sm" onclick="toast('Archive export started — writing older rows to cold storage…')">Export archive now</button></div></div>`;

/* ---------- live feed generation (shared store) ---------- */
let feedTimer=null;
function updateCounts(){const c=counts();const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
 set('m_total',c.total);set('m_open',c.open);set('m_res',c.resolved);set('m_supp',c.supp);
 const sub=document.getElementById('ovsub');if(sub)sub.textContent=`${c.open} open of ${c.total} events this session — ${c.resolved} resolved, ${c.supp} auto-suppressed.`;}
function startFeed(){clearInterval(feedTimer);
 const paint=()=>{const el=document.getElementById('feed');if(!el)return;
   let list=events.slice().reverse();
   const f=state.feedFilter||'all';
   if(f==='open')list=list.filter(e=>e.dec==='escalate'&&e.status!=='resolved');
   else if(f==='resolved')list=list.filter(e=>e.status==='resolved');
   else if(f==='suppress')list=list.filter(e=>e.dec==='suppress');
   if(state.esconly)list=list.filter(e=>e.dec==='escalate');
   el.innerHTML=list.length?list.slice(0,20).map(feedRow).join(''):'<div class="card" style="color:var(--tx2)">Nothing matches this filter yet.</div>';};
 paint();
 feedTimer=setInterval(()=>{
   const e=mkEvent(TPL[Math.floor(Math.random()*TPL.length)]);events.push(e);
   if(events.length>60)events.shift();
   if(state.page==='feed')paint();
   if(state.page==='overview')renderApp(); // refresh attention queue + counters
   else updateCounts();
   const badge=document.querySelector('.navitem.active');// keep nav attn fresh
 },3000);
}

/* ---------- router ---------- */
function go(view){['splash','login','app'].forEach(v=>document.getElementById(v).classList.toggle('hide',v!==view));if(view==='app')document.getElementById('app').style.display='flex';if(view!=='app')clearInterval(feedTimer);}
seedEvents();renderSplash();renderLogin();go('splash');
</script></body></html>
