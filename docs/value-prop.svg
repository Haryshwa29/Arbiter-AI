<svg width="680" height="470" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
<style>.t{fill:#c9d1d9;font-size:14px;font-weight:600}.s{fill:#8b949e;font-size:12px}.big{font-size:34px;font-weight:700}.stat{font-size:22px;font-weight:700;fill:#c9d1d9}</style>
<rect width="680" height="470" fill="#0d1117"/>

<rect x="24" y="24" width="300" height="300" rx="10" fill="#2a1210" stroke="#7a3d24"/>
<text x="44" y="52" class="t" fill="#f0a482">without Arbiter</text>
<text x="44" y="98" class="big" fill="#f0a482">3,000</text>
<text x="44" y="118" class="s">alerts a day, no one to read them</text>
<text x="44" y="158" class="s">✕  hire an analyst you can't afford yet</text>
<text x="44" y="184" class="s">✕  or buy a tool that still needs watching</text>
<text x="44" y="210" class="s">✕  open-source stacks need rules &amp; tuning</text>
<text x="44" y="236" class="s">✕  alerts pile up, unread</text>
<text x="44" y="288" class="s" fill="#c9906f" font-size="13">result: growing, targeted, unprotected</text>

<line x1="332" y1="174" x2="354" y2="174" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="362" y="24" width="294" height="300" rx="10" fill="#0f2a22" stroke="#1d6e56"/>
<text x="382" y="52" class="t" fill="#6fe0bd">with Arbiter</text>
<text x="382" y="98" class="big" fill="#6fe0bd">12</text>
<text x="382" y="118" class="s">actually reach you — with evidence</text>
<text x="382" y="158" class="s">✓  triaged 24/7 on your own hardware</text>
<text x="382" y="184" class="s">✓  ~99% suppressed, each with a reason</text>
<text x="382" y="210" class="s">✓  the few that matter, with a fix</text>
<text x="382" y="236" class="s">✓  runs in your network · data never leaves</text>
<text x="382" y="288" class="s" fill="#7fd4b3" font-size="13">result: the analyst is built in</text>

<rect x="24" y="340" width="632" height="106" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="340" y="368" class="t" text-anchor="middle">minutes a day, not a headcount</text>
<text x="120" y="410" class="stat" text-anchor="middle">1</text><text x="120" y="430" class="s" text-anchor="middle">founder</text>
<text x="280" y="410" class="stat" text-anchor="middle">0</text><text x="280" y="430" class="s" text-anchor="middle">new hires</text>
<text x="440" y="410" class="stat" text-anchor="middle">~15m</text><text x="440" y="430" class="s" text-anchor="middle">a day</text>
<text x="580" y="410" class="stat" text-anchor="middle" fill="#6fe0bd">99%</text><text x="580" y="430" class="s" text-anchor="middle">auto-handled</text>

<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
</svg>
