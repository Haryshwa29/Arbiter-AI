<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arbiter AI</title>
    <!--
      Blocking, synchronous, before any stylesheet (THEME-BRIEF.md §1a). This
      is what makes the manual override safe on a prerendered page: a module
      import runs after first paint and the wrong theme flashes for a frame.
      Keep this in sync with frontend/src/lib/scheme.ts's storage key and
      choice values — it can't import that module, it has to run before it.

      Always writes a RESOLVED value ("light" or "dark"), never omits the
      attribute for System: index.css's `@custom-variant dark` binds every
      Tailwind `dark:` utility to this attribute rather than to
      prefers-color-scheme, so an absent attribute would mean every
      dark:-styled element stops following the OS too, not just the ones
      driven by CSS custom properties.
    -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
