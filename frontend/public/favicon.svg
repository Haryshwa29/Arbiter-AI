<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
  <!--
    The Arbiter mark: circle and chord, the same geometry as Nav.tsx and as
    every station gate TransitField.tsx draws. The chord runs (15,3.6) to
    (9,20.4) — that angle is the source of truth the field derives its LOGO
    constant from, so it must not be redrawn by eye here.

    Stroke is 2.2 rather than the nav's 1.4: at a 16px tab the thinner weight
    renders under one device pixel and the mark turns to a smudge.

    The colour follows the browser's theme, matching the mark token in
    index.css. An SVG favicon can carry its own media query, so the amber
    darkens on a light tab strip, where the brighter value would be roughly
    2:1 and unreadable.

    (No double hyphens anywhere in this comment: XML forbids them, and an
    invalid comment makes the browser reject the entire file.)
  -->
  <style>
    .mark { stroke: #B4841F; }
    @media (prefers-color-scheme: dark) {
      .mark { stroke: #d9a943; }
    }
  </style>
  <g class="mark" fill="none" stroke-width="2.2" stroke-linecap="round">
    <circle cx="12" cy="12" r="9.2" />
    <line x1="15" y1="3.6" x2="9" y2="20.4" />
  </g>
</svg>
